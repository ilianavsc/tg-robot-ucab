name: robot_ucab_app
description: "App movil del robot de laboratorio UCAB: pedidos de componentes, telemetria y alertas."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  mqtt_client: ^10.14.0
  provider: ^6.1.5+1
  uuid: ^4.6.0
  shared_preferences: ^2.5.6
  intl: ^0.20.3
  # Descarga del reporte CSV (P12) en Flutter Web (ya venía como transitiva).
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true

  # Fuentes del sistema de diseño "Autonomous Laboratory Cockpit" (DESIGN.md).
  # Van incrustadas (subconjunto Latin, ~320 KB en total) y no se descargan en
  # tiempo de ejecución: el Modo Demo debe verse igual sin internet.
  # Licencias OFL 1.1 en assets/fonts/LICENSE-*.txt.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.otf
        - asset: assets/fonts/Inter-SemiBold.otf
          weight: 600
        - asset: assets/fonts/Inter-Bold.otf
          weight: 700
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
        - asset: assets/fonts/JetBrainsMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/JetBrainsMono-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/JetBrainsMono-Bold.ttf
          weight: 700
