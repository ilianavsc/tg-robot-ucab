name: Despliegue de Flutter Web en GitHub Pages

# Se ejecuta en cada push a main y también a mano desde la pestaña Actions.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Necesario para que el job pueda empujar la rama gh-pages.
permissions:
  contents: write

# Si se empujan dos commits seguidos, se queda con el último despliegue.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    name: Compilar la app y publicar
    runs-on: ubuntu-latest
    steps:
      - name: Clonar el repositorio
        uses: actions/checkout@v4

      - name: Instalar Flutter (misma versión que en las pruebas)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.8
          cache: true

      - name: Dependencias de la app
        working-directory: app
        run: flutter pub get

      - name: Compilar Flutter Web en la subcarpeta /app/
        working-directory: app
        run: flutter build web --release --base-href /tg-robot-ucab/app/

      - name: Armar la carpeta que se publica
        run: |
          set -euo pipefail
          PUB="$GITHUB_WORKSPACE/public"
          mkdir -p "$PUB"
          # 1) El portafolio ocupa la RAÍZ del sitio
          cp "$GITHUB_WORKSPACE"/*.html "$PUB"/
          cp "$GITHUB_WORKSPACE"/*.md "$PUB"/
          cp -r assets datos prototipos docs hardware "$PUB"/
          # 2) La app Flutter queda en /app
          mkdir -p "$PUB/app"
          cp -r app/build/web/. "$PUB/app"/
          echo "Raíz publicada:"
          ls -la "$PUB"
          echo "App publicada:"
          ls -la "$PUB/app" | head -20

      - name: Publicar en la rama gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./public
          # Historial limpio: un solo commit por despliegue
          force_orphan: true
          # Agrega .nojekyll para que Pages no procese los archivos de Flutter
          enable_jekyll: false
