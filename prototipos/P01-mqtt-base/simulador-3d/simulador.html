/* HUD chrome shared by every sim. 1rem = 10px at the 1080x1350 reference
   size; runtime sets html font-size from the viewport so it scales. */

:root {
  --bg: #09090a;
  --fg: #ece6d6;
  --dim: rgba(236, 230, 214, 0.64);
  --mute: rgba(236, 230, 214, 0.38);
  --faint: rgba(236, 230, 214, 0.16);
  --line: rgba(236, 230, 214, 0.14);
  --panel: rgba(9, 9, 10, 0.9);
  --accent: #f2b632;
  --top: 13.4rem;
  --bot: 30.5rem;
}
:root[data-theme='light'] {
  --bg: #f3f2ee;
  --fg: #151515;
  --dim: rgba(21, 21, 21, 0.66);
  --mute: rgba(21, 21, 21, 0.42);
  --faint: rgba(21, 21, 21, 0.16);
  --line: rgba(21, 21, 21, 0.16);
  --panel: rgba(243, 242, 238, 0.93);
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; }
#app {
  position: fixed; inset: 0; color: var(--fg);
  font-family: 'JetBrains Mono', ui-monospace, monospace;
  font-variant-ligatures: none; -webkit-font-smoothing: antialiased;
}
#gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.hud { position: absolute; inset: 0; pointer-events: none; }
.hud.hidden { display: none; }
.accent { color: var(--accent); }

/* header */
.hdr {
  position: absolute; left: 0; right: 0; top: 0; height: var(--top);
  padding: 2.4rem 2.8rem 0;
  background: linear-gradient(var(--bg) 0%, var(--bg) 78%, transparent 100%);
}
.row { display: flex; align-items: baseline; white-space: nowrap; }
.row1 { gap: 5.6rem; }
.title { display: flex; align-items: center; gap: 1.3rem; font-size: 3.6rem; font-weight: 600; letter-spacing: 0.04em; }
.title .bar { display: inline-block; width: 0.75rem; height: 3.6rem; background: var(--accent); }
.sub { font-size: 1.75rem; color: var(--dim); letter-spacing: 0.08em; }
.right { margin-left: auto; font-size: 1.6rem; color: var(--dim); letter-spacing: 0.1em; }
.row2 { margin-top: 2rem; font-size: 1.95rem; }
.row2 .stage { width: 21rem; letter-spacing: 0.05em; }
.row2 .cmd { color: var(--fg); }
.row2 .time { margin-left: auto; letter-spacing: 0.05em; }
.prog { position: absolute; left: 2.8rem; right: 2.8rem; bottom: 1.2rem; height: 0.35rem; }
.prog i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--accent); }

/* viewport overlays */
.ann { position: absolute; inset: 0; overflow: hidden; }
.ann div {
  position: absolute; transform: translate(1.4rem, -50%); white-space: nowrap;
  font-size: 1.7rem; letter-spacing: 0.04em; color: var(--fg);
  text-shadow: 0 0 0.6rem var(--bg), 0 0 1.2rem var(--bg);
}
.ann div.a { color: var(--accent); }
.ann div.box {
  padding: 0.8rem 1.1rem; border: 1px solid var(--line); background: var(--panel);
  text-shadow: none; line-height: 1.45; font-size: 1.55rem;
}
.ann div.box b { color: var(--accent); font-weight: 600; }
.wm {
  position: absolute; right: 3rem; bottom: calc(var(--bot) + 1.6rem);
  font-size: 2.3rem; letter-spacing: 0.06em; color: var(--fg); opacity: 0.3;
}

/* bottom panel */
.bot {
  position: absolute; left: 0; right: 0; bottom: 0; height: var(--bot);
  display: flex; border-top: 1px solid var(--line); background: var(--panel);
  padding: 2rem 2.8rem 1.6rem;
}
.term { flex: 1; min-width: 0; display: flex; flex-direction: column; padding-right: 2.6rem; }
.thead { display: flex; align-items: baseline; gap: 2.4rem; font-size: 1.75rem; white-space: nowrap; }
.thead .host { font-size: 2.1rem; }
.thead .path { color: var(--dim); }
.thead .status { margin-left: auto; font-size: 1.5rem; letter-spacing: 0.1em; display: flex; align-items: center; gap: 0.9rem; }
.thead .status i { width: 1rem; height: 1rem; border-radius: 50%; background: var(--accent); display: inline-block; }
.prompt { margin-top: 1.9rem; font-size: 2.2rem; white-space: nowrap; overflow: hidden; }
.logs { margin-top: 1.1rem; font-size: 1.85rem; line-height: 1.52; flex: 1; overflow: hidden; }
.logs div { white-space: nowrap; overflow: hidden; text-overflow: clip; }
.logs .ln { color: var(--mute); display: inline-block; width: 6.4rem; }
.logs .hl { color: var(--accent); }
.caret { display: inline-block; width: 0.95em; height: 1.05em; vertical-align: -0.15em; background: var(--accent); margin-left: 0.15em; }
.tfoot { font-size: 1.35rem; color: var(--mute); white-space: nowrap; letter-spacing: 0.04em; }
.side {
  width: 31%; border-left: 1px solid var(--line); padding-left: 2.2rem;
  display: flex; flex-direction: column;
}
.shead { font-size: 1.45rem; letter-spacing: 0.12em; }
.mini { width: 100%; flex: 1; min-height: 0; display: block; margin: 0.8rem 0; }
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem 1.4rem; font-size: 1.35rem; color: var(--mute); }
.stats b { display: block; font-size: 2rem; color: var(--fg); font-weight: 600; letter-spacing: 0.02em; }
.sfoot { margin-top: 0.8rem; font-size: 1.3rem; color: var(--mute); letter-spacing: 0.05em; }
.baseline { position: absolute; left: 2.8rem; right: 2.8rem; bottom: 0.9rem; height: 0.25rem; background: var(--line); }
.baseline i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--accent); }

/* director layers */
.dir-glitch { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.dir-flash {
  position: absolute; inset: 0; pointer-events: none; opacity: 0; mix-blend-mode: screen;
  background: radial-gradient(ellipse 75% 55% at 50% 45%, var(--accent) 0%, transparent 70%), rgba(255,255,255,0.18);
}
.dir-story {
  position: absolute; left: 0; right: 0; top: 0; bottom: 0; pointer-events: none;
  display: flex; align-items: flex-end; justify-content: center; padding: 0 4.5rem 6rem; opacity: 0;
}
.cap { text-align: center; max-width: 96rem; position: relative; }
.cap::before {
  content: ''; position: absolute; inset: -6rem -10rem; z-index: -1;
  background: radial-gradient(ellipse 50% 50% at 50% 55%, rgba(0,0,0,0.62) 0%, rgba(0,0,0,0) 100%);
}
:root[data-theme='light'] .cap::before { background: radial-gradient(ellipse 50% 50% at 50% 55%, rgba(243,242,238,0.8) 0%, rgba(243,242,238,0) 100%); }
.cap-main {
  font-family: 'Inter', 'Inter Variable', system-ui, sans-serif; font-weight: 800;
  font-size: 11.5rem; line-height: 0.98; letter-spacing: -0.035em; color: var(--fg);
  text-shadow: 0 0.4rem 2.4rem rgba(0,0,0,0.55);
}
.cap.num .cap-main { font-size: 15rem; font-variant-numeric: tabular-nums; letter-spacing: -0.045em; }
.cap-main .w { display: inline-block; transform-origin: 50% 70%; }
.cap-main .w.hl { background: var(--accent); color: #0a0a0a; padding: 0 0.14em; text-shadow: none; border-radius: 0.06em; }
.cap-sub {
  margin-top: 2rem; font-size: 2.7rem; letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--fg); opacity: 0.85; min-height: 1.3em;
}
.cap-tag {
  display: inline-block; margin-bottom: 1.8rem; padding: 0.5rem 1.2rem; font-size: 2.2rem; letter-spacing: 0.12em;
  border: 1px solid var(--accent); color: var(--accent); background: rgba(0,0,0,0.5);
}

/* ---- P01 · simulador de mensajes ---- */
:root{--tinta:#14213D;--sale:#0F9D84;--llega:#F2603D;--qos:#6B4EE6;--pend:#F2B33D;--papel:#EEF3F1}
html{font-size:16px!important}
html,body{background:#EEF3F1!important}
body{font-family:'Atkinson Hyperlegible',system-ui,sans-serif;color:var(--tinta)}
#app{position:fixed;inset:0;width:auto!important;height:auto!important;transform:none!important;left:0!important;top:0!important}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:grab;touch-action:pan-y}
#gl:active{cursor:grabbing}
.barra{position:absolute;left:24px;top:16px;right:340px;pointer-events:none}
.ceja{font:600 12.5px 'JetBrains Mono',monospace;letter-spacing:.08em;color:#5b6b7a;text-transform:uppercase}
.barra h1{font:700 34px/1.05 'Bricolage Grotesque',sans-serif;margin:2px 0 4px}
.sub{margin:0;font:400 17px 'Atkinson Hyperlegible',sans-serif;color:#3b4a5a;max-width:780px}
.panel{position:absolute;left:24px;top:124px;width:300px;background:#fff;border:2px solid var(--tinta);border-radius:16px;padding:14px 16px;box-shadow:5px 5px 0 var(--tinta)}
.panel h2,.leyenda h2{font:700 15px 'Bricolage Grotesque',sans-serif;margin:0 0 8px;text-transform:uppercase;letter-spacing:.05em}
.qos{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.qb{font:700 15px 'Atkinson Hyperlegible',sans-serif;border:2px solid var(--tinta);background:#fff;border-radius:10px;padding:7px 2px;cursor:pointer;color:var(--tinta)}
.qb small{display:block;font:400 11.5px 'JetBrains Mono',monospace;color:#5b6b7a}
.qb.on{background:var(--qos);border-color:var(--qos);color:#fff}.qb.on small{color:#e3dcff}
.nota{font:400 14.5px/1.4 'Atkinson Hyperlegible',sans-serif;margin:8px 0 12px;color:#3b4a5a;min-height:56px}
.acc{display:block;width:100%;font:700 16px 'Atkinson Hyperlegible',sans-serif;padding:10px 12px;border-radius:10px;border:2px solid var(--tinta);cursor:pointer;margin-top:8px;color:#fff;text-align:left}
.acc.llega{background:var(--llega);border-color:var(--llega)}.acc.qosb{background:var(--qos);border-color:var(--qos)}
.acc.pend{background:var(--pend);border-color:var(--pend);color:var(--tinta)}.acc.sale{background:var(--sale);border-color:var(--sale)}
.acc:disabled,.qb:disabled{opacity:.45;cursor:not-allowed}
.acc[hidden]{display:none}
.lento{display:block;margin-top:10px;font-size:14px;color:#3b4a5a}
.tiempo{margin-top:10px;font-size:13.5px}
.barra-t{height:10px;background:#e8e2fb;border-radius:6px;overflow:hidden;margin:6px 0 2px}.barra-t i{display:block;height:100%;width:0;background:var(--qos)}
.tiempo small{font:400 12px 'JetBrains Mono',monospace;color:#5b6b7a}
.leyenda{position:absolute;right:24px;top:16px;width:290px;background:#fff;border:2px solid var(--tinta);border-radius:16px;padding:10px 14px;box-shadow:5px 5px 0 var(--tinta)}
.top{display:flex;gap:10px;align-items:flex-start;margin:5px 0}.top i{width:14px;height:14px;border-radius:50%;margin-top:3px;flex:none}
.top code{font:600 13px 'JetBrains Mono',monospace}.top small{display:block;font-size:13px;color:#5b6b7a}
.consola{position:absolute;left:0;right:0;bottom:0;height:210px;background:#0f1a30;color:#e8eef5;border-top:3px solid var(--tinta);display:flex;flex-direction:column}
.cons-cab{display:flex;gap:12px;align-items:center;padding:7px 18px;background:#14213D;font-size:13.5px}.cons-cab span{color:#9fb0c4}
.cons-cab button{margin-left:auto;font:600 12px 'JetBrains Mono',monospace;background:transparent;color:#9fb0c4;border:1px solid #3a4a68;border-radius:6px;padding:3px 9px;cursor:pointer}
#log{flex:1;overflow:auto;padding:6px 18px 10px;font:400 13px/1.55 'JetBrains Mono',monospace}
.ln{display:flex;gap:10px;align-items:baseline}.ln time{color:#7e90a8;flex:none;width:46px;text-align:right}
.tag{flex:none;font:700 11px 'JetBrains Mono',monospace;color:#fff;padding:1px 7px;border-radius:5px;min-width:58px;text-align:center}
.ln .tx{overflow-wrap:anywhere}
@media (max-width:900px){.leyenda{display:none}.barra{right:24px}.panel{top:96px;width:260px}}
@media (max-height:700px){.consola{height:160px}.nota{min-height:0}}
@media (max-width:768px){
  html,body{height:auto;overflow-x:hidden}
  #app{position:relative;overflow:visible;height:auto;min-height:0;display:flex;flex-direction:column;box-sizing:border-box;padding-bottom:calc(90px + env(safe-area-inset-bottom,0px))}
  .embebido #app{padding-bottom:14px}
  .barra{position:static;padding:14px 14px 6px;right:auto;pointer-events:auto;background:var(--papel,#EEF3F1)}
  .barra h1{font-size:22px;margin:2px 0}
  .sub{font-size:14px;line-height:1.35}
  #gl{position:relative;inset:auto;height:var(--gl-h,26vh);min-height:150px;max-height:260px;width:100%;flex:none;z-index:1;touch-action:pan-y}
  .panel{position:static;width:auto;margin:10px 12px;padding:14px;border-radius:14px;box-shadow:4px 4px 0 var(--tinta);z-index:2}
  .panel h2{font-size:14px}
  .qos{gap:8px}
  .qb{min-height:48px;padding:8px 4px;font-size:15px;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .qb small{font-size:11px}
  .nota{min-height:0;margin:8px 0 10px;font-size:13.5px}
  .acc{min-height:48px;font-size:16px;padding:12px 14px;margin-top:8px;display:flex;align-items:center}
  .leyenda{display:none}
  .consola{position:static;height:240px;margin:0 12px 18px;border-radius:14px;border:2px solid var(--tinta);box-shadow:4px 4px 0 var(--tinta);overflow:hidden;flex:none;z-index:2}
  .cons-cab{padding:8px 12px}
  .cons-cab button{min-height:34px;padding:4px 12px;font-size:13px}
  #log{font-size:12px;padding:8px 12px}
}

.barra h1,.panel h2,.leyenda h2{color:var(--tinta)!important}.top code,.top small,.nota{color:var(--tinta)}.top small{color:#5b6b7a}
.lento,.tiempo,.top small{font-family:'Atkinson Hyperlegible',sans-serif}

<script>
/* Embebido en iframe (movil): sin doble scroll. Mide la altura real y se la envia a la pagina padre. */
(function () {
  var emb = false;
  try { emb = window.self !== window.top; } catch (e) { emb = true; }
  if (!emb) return;
  var root = document.documentElement;
  root.classList.add("embebido");
  var mq = window.matchMedia("(max-width:768px)");
  var ultimo = -1;
  function altoPadre() {
    try { return window.parent.innerHeight; } catch (e) { return window.screen.height; }
  }
  function medir() {
    var app = document.getElementById("app");
    if (!app) return;
    var h = null;
    if (mq.matches) {
      root.style.setProperty("--gl-h", Math.round(altoPadre() * 0.26) + "px");
      h = Math.ceil(app.getBoundingClientRect().height);
    } else {
      root.style.removeProperty("--gl-h");
    }
    if (h === ultimo) return;
    ultimo = h;
    try { window.parent.postMessage({ tipo: "p01-altura", h: h }, "*"); } catch (e) {}
  }
  window.addEventListener("load", medir);
  window.addEventListener("resize", medir);
  if (mq.addEventListener) mq.addEventListener("change", medir);
  if (window.ResizeObserver) {
    var app0 = document.getElementById("app");
    if (app0) new ResizeObserver(medir).observe(app0);
  }
  medir();
})();
</script>

<style id="pl-css">
/* --- modo escenario (P03, P08): paneles dibujados sobre el lienzo 1600 × 900 --- */
.pl-m{transition:opacity .2s ease,visibility .2s ease,background .15s,color .15s}
.pl-cp,.pl-cab{transition:top .25s ease,height .25s ease}
.pl-oculto{opacity:0!important;visibility:hidden!important;pointer-events:none!important}
.pl-bar{position:absolute;z-index:3;pointer-events:auto;cursor:pointer;background:transparent;border:0;margin:0;padding:0 46px 0 0;display:flex;align-items:center;justify-content:flex-end;font:700 17px 'JetBrains Mono',monospace;line-height:1;color:#0F9D84;border-radius:12px;transition:top .25s ease}
.pl-bar:hover{color:#0F9D84}
.pl-bar:focus-visible,.pl-todo:focus-visible,.pl-tg:focus-visible{outline:2.5px solid #6B4EE6;outline-offset:2px}
.pl-todo{position:absolute;left:470px;top:104px;height:26px;padding:0 13px;border:1.5px solid #14213D;border-radius:999px;background:rgba(255,255,255,.92);color:#14213D;font:700 9.5px 'JetBrains Mono',monospace;letter-spacing:1.2px;cursor:pointer;pointer-events:auto;white-space:nowrap}
.pl-todo:hover{background:#14213D;color:#fff}

.pl-tg{display:flex;width:100%;align-items:center;justify-content:space-between;gap:10px;background:transparent;border:0;padding:0;margin:0;cursor:pointer;font:700 15px 'Bricolage Grotesque',sans-serif;color:#14213D;text-transform:uppercase;letter-spacing:.05em;text-align:left}
.pl-tg small{font:600 11px 'JetBrains Mono',monospace;color:#5b6b7a;letter-spacing:.06em;text-transform:none}
.pl-tg::after{content:'+';font:700 18px 'JetBrains Mono',monospace;line-height:1;color:#0F9D84}
.pl-abierto>.pl-tg::after,.pl-abierto>.cons-cab>.pl-tg::after{content:'−'}

<script id="pl-js">
(function () {
  var avisar = function () { setTimeout(function () { window.dispatchEvent(new Event('resize')); }, 280); };

  // ---------- Modo escenario (P03 y P08) ----------
  function modoEscenario(ui) {
    var W = 1600, H = 900, EXCLUIR = /\b(call|cur|ring|tourchip|turn|pl-bar|pl-todo)\b/;
    var cps = Array.prototype.slice.call(ui.querySelectorAll(':scope > .cp'));
    var px = function (v) { return v === '' ? NaN : parseFloat(v); };
    var paneles = cps.map(function (cp) {
      var r = {x: px(cp.style.left), y: px(cp.style.top), w: px(cp.style.width), h: px(cp.style.height)};
      return {cp: cp, r: r, abajo: r.y > H / 2, miembros: [], ph: null, pn: null, abierto: true};
    });
    Array.prototype.forEach.call(ui.children, function (n) {
      if (n.classList.contains('cp')) return;
      var cls = n.getAttribute('class') || '';
      if (EXCLUIR.test(cls)) return;
      var x = px(n.style.left), y = px(n.style.top);
      if (isNaN(x) && !isNaN(px(n.style.right))) x = W - px(n.style.right) - 12; // los números de panel se ubican por la derecha
      if (isNaN(x) || isNaN(y)) return;
      for (var i = 0; i < paneles.length; i++) {
        var r = paneles[i].r;
        if (x >= r.x - 1 && x < r.x + r.w && y >= r.y - 1 && y < r.y + r.h) {
          if (n.classList.contains('ph')) paneles[i].ph = n;
          else if (n.classList.contains('pn')) paneles[i].pn = n;
          else { n.classList.add('pl-m'); paneles[i].miembros.push(n); }
          return;
        }
      }
    });
    var BAR = 40, CAB = 30;
    paneles.forEach(function (p) {
      p.cp.classList.add('pl-cp');
      [p.ph, p.pn].forEach(function (e) { if (e) { e.classList.add('pl-cab'); e.dataset.top = px(e.style.top) - p.r.y; } });
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'pl-bar';
      b.style.left = p.r.x + 'px';
      b.style.width = p.r.w + 'px';
      b.style.height = (p.abajo ? BAR : CAB) + 'px';
      var titulo = p.ph ? p.ph.textContent.trim() : 'panel';
      b.addEventListener('click', function () { poner(p, !p.abierto); avisar(); });
      ui.appendChild(b);
      p.bar = b;
      p.titulo = titulo;
    });
    function poner(p, abierto) {
      p.abierto = abierto;
      var r = p.r, y0 = abierto || !p.abajo ? r.y : r.y + r.h - BAR;
      p.cp.style.top = y0 + 'px';
      p.cp.style.height = (abierto ? r.h : BAR) + 'px';
      [p.ph, p.pn].forEach(function (e) { if (e) e.style.top = (y0 + Number(e.dataset.top)) + 'px'; });
      p.bar.style.top = y0 + 'px';
      p.bar.style.height = (abierto ? CAB : BAR) + 'px';
      p.bar.textContent = abierto ? '−' : '+';
      p.bar.setAttribute('aria-expanded', abierto);
      p.bar.setAttribute('aria-label', (abierto ? 'Cerrar el panel ' : 'Abrir el panel ') + p.titulo);
      p.miembros.forEach(function (m) { m.classList.toggle('pl-oculto', !abierto); });
      todo.textContent = paneles.some(function (q) { return q.abierto; }) ? 'CERRAR PANELES' : 'ABRIR PANELES';
    }
    var todo = document.createElement('button');
    todo.type = 'button';
    todo.className = 'pl-todo';
    todo.addEventListener('click', function () {
      var abrir = !paneles.some(function (q) { return q.abierto; });
      paneles.forEach(function (p) { poner(p, abrir); });
      avisar();
    });
    ui.appendChild(todo);
    paneles.forEach(function (p) { poner(p, false); }); // cerrados al empezar
    avisar();
  }

  // ---------- Modo P01 (paneles HTML) ----------
  function plegable(caja, titulo, sub) {
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'pl-tg';
    b.innerHTML = titulo + (sub ? ' <small>' + sub + '</small>' : '');
    var cuerpo = document.createElement('div');
    cuerpo.className = 'pl-cuerpo';
    var dentro = document.createElement('div');
    dentro.className = 'pl-in';
    while (caja.firstChild) dentro.appendChild(caja.firstChild); // se mueven los mismos nodos: los botones siguen funcionando
    cuerpo.appendChild(dentro);
    caja.appendChild(b);
    caja.appendChild(cuerpo);
    caja.classList.add('pl-p');
    var poner = function (a) {
      caja.classList.toggle('pl-abierto', a);
      b.setAttribute('aria-expanded', a);
      dentro.inert = !a;
    };
    b.addEventListener('click', function () { poner(!caja.classList.contains('pl-abierto')); avisar(); });
    poner(false);
  }
  function modoP01() {
    var panel = document.querySelector('#app > .panel');
    var ley = document.querySelector('#app > .leyenda');
    var cons = document.querySelector('#app > .consola');
    if (panel) plegable(panel, 'Controles', 'QoS, orden, alarma, LWT');
    if (ley && ley.children.length) plegable(ley, 'Buzones', '5 tópicos');
    if (cons) {
      var cab = cons.querySelector('.cons-cab');
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'pl-tg';
      b.innerHTML = 'Consola <small>lo que ve el broker</small>';
      cab.insertBefore(b, cab.firstChild);
      cons.classList.add('pl-p');
      var poner = function (a) { cons.classList.toggle('pl-abierto', a); b.setAttribute('aria-expanded', a); };
      b.addEventListener('click', function () { poner(!cons.classList.contains('pl-abierto')); avisar(); });
      poner(false);
    }
    avisar();
  }

  // Espera a que la interfaz exista (la arma el módulo después de cargar)
  var intentos = 0;
  (function esperar() {
    var ui = document.querySelector('.ui');
    if (ui && ui.querySelector(':scope > .cp')) return setTimeout(function () { modoEscenario(ui); }, 400);
    if (document.querySelector('#app > .panel .acc')) return modoP01();
    if (++intentos < 100) setTimeout(esperar, 100);
  })();
})();
</script>
